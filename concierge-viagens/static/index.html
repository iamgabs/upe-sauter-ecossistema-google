<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concierge de Viagens</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #111c33; --border: #22304f; --text: #e6edf7; --muted: #8fa0bf;
      --accent: #38bdf8; --user: #1d4ed8; --bot: #17223b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; justify-content: center;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(760px, 100%); display: flex; flex-direction: column; height: 100%; }
    header { padding: 18px 20px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.bot.error { border-color: #7f1d1d; }
    .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #0b2a3d; color: var(--accent); border: 1px solid #14506f; }
    .typing { color: var(--muted); font-style: italic; }
    #suggestions { padding: 0 20px 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    #suggestions button {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px;
    }
    #suggestions button:hover { color: var(--text); border-color: var(--accent); }
    form { display: flex; gap: 10px; padding: 14px 20px 20px; border-top: 1px solid var(--border); background: var(--panel); }
    input {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 15px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    form button {
      padding: 0 20px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #04202e; font-weight: 600;
    }
    form button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>✈️ Concierge de Viagens</h1>
    <p>Um orquestrador de agentes (Google ADK) que aciona especialistas em destinos, clima e orçamento.</p>
  </header>

  <div id="messages"></div>

  <div id="suggestions">
    <button type="button">Quero uma praia quente com diária de até R$ 500</button>
    <button type="button">Como está o clima em Recife?</button>
    <button type="button">Quanto custa 5 dias para 2 pessoas? Passagem R$ 900 cada, diária R$ 400, gasto de R$ 250/dia por pessoa</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Pergunte sobre sua próxima viagem…" autocomplete="off" maxlength="1000" autofocus>
    <button id="send" type="submit">Enviar</button>
  </form>
</main>

<script>
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // Identidade simples do usuário: um id aleatório guardado no navegador.
  // O backend mantém uma conversa por user_id. Num sistema real, viria do login.
  let userId = localStorage.getItem("concierge_user_id");
  if (!userId) {
    userId = "web-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("concierge_user_id", userId);
  }

  const SPECIALIST_LABELS = {
    destinos_agent: "🧭 Destinos",
    clima_agent: "⛅ Clima",
    orcamento_agent: "💰 Orçamento",
  };

  function addMessage(text, role, extra = {}) {
    const el = document.createElement("div");
    el.className = "msg " + role + (extra.error ? " error" : "");
    el.textContent = text; // textContent (e não innerHTML) evita injeção de HTML vinda do modelo

    if (extra.specialists && extra.specialists.length) {
      const tags = document.createElement("div");
      tags.className = "tags";
      for (const name of extra.specialists) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = SPECIALIST_LABELS[name] || name;
        tags.appendChild(tag);
      }
      el.appendChild(tags);
    }
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  async function send(text) {
    addMessage(text, "user");
    const typing = addMessage("Consultando os especialistas…", "bot typing");
    sendBtn.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, message: text }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      typing.remove();
      addMessage(data.answer, "bot", { specialists: data.specialists, error: data.blocked });
    } catch (err) {
      typing.remove();
      addMessage("Não consegui falar com o servidor (" + err.message + ").", "bot", { error: true });
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    send(text);
  });

  document.querySelectorAll("#suggestions button").forEach((btn) =>
    btn.addEventListener("click", () => send(btn.textContent))
  );

  addMessage("Olá! Sou o Concierge de Viagens. Posso sugerir destinos, consultar o clima e calcular o orçamento da sua viagem. Por onde começamos?", "bot");
</script>
</body>
</html>
